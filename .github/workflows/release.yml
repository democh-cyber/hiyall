name: Release
# Runs only for tags like v1.2.3. Nothing here deploys: the API image is pushed to GHCR by digest, the
# mobile bundles are built and attached to a DRAFT GitHub release, and the production migration waits for a
# reviewer to approve the `production` environment. Owner setup (environment, secrets, variables) is in
# docs/deployment/11-environments.md, section "GitHub".
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # A tag must point at a commit whose normal checks passed. This re-runs the fast, decisive ones.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: hiyall
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: hiyall_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hiyall -d hiyall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hiyall:ci-only-disposable@localhost:5432/hiyall_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://hiyall:ci-only-disposable@localhost:5432/hiyall_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go run ./cmd/migrate && go vet ./... && go test -race ./...
        working-directory: services/api

  api-image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR; no other job has this
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: name
        # GHCR names must be lower case.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
      - run: echo "Pushed ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    needs: api-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # anchore/sbom-action v0.24.2: the SHA is the commit the annotated tag points at, resolved with
      # `git ls-remote --tags https://github.com/anchore/sbom-action.git v0.24.2` (the ^{} line).
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ needs.api-image.outputs.image }}@${{ needs.api-image.outputs.digest }}
          format: spdx-json
          output-file: api-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-sbom
          path: api-sbom.spdx.json

  android:
    # Skipped (not failed) until the owner has added the signing secrets and release variables.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAVE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Guard
        id: guard
        run: |
          if [ "$HAVE_SIGNING" != "true" ] || [ ! -x scripts/build-release.sh ]; then
            echo "Android release skipped: ANDROID_KEYSTORE_BASE64 secret or scripts/build-release.sh is missing." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - if: steps.guard.outputs.run == 'true'
        # Rust mobile libraries: rust_builder (cargokit) compiles hiyall_e2ee for each Android ABI during
        # the Gradle build, so the targets must be installed first.
        run: |
          rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - if: steps.guard.outputs.run == 'true'
        name: Write signing files (never committed, never logged)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > apps/mobile/android/key.properties
      - if: steps.guard.outputs.run == 'true'
        # build-release.sh fails on any missing define, so a build can never ship "not configured".
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        run: scripts/build-release.sh android
      - if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: |
            apps/mobile/build/app/outputs/bundle/release/*.aab
            apps/mobile/build/symbols/**
          if-no-files-found: error

  ios:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAVE_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Guard
        id: guard
        run: |
          if [ "$HAVE_SIGNING" != "true" ] || [ ! -x scripts/build-release.sh ]; then
            echo "iOS release skipped: IOS_CERTIFICATE_BASE64 secret or scripts/build-release.sh is missing." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - if: steps.guard.outputs.run == 'true'
        # Rust mobile libraries: cargokit builds the static library for the device during the Xcode build.
        run: |
          rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
          rustup target add aarch64-apple-ios
      - if: steps.guard.outputs.run == 'true'
        name: Install signing certificate and provisioning profile (temporary keychain)
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/hiyall.mobileprovision
      - if: steps.guard.outputs.run == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        run: scripts/build-release.sh ios
      - if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa
          path: |
            apps/mobile/build/ios/ipa/*.ipa
            apps/mobile/build/symbols/**
          if-no-files-found: error

  draft-release:
    # Attaches whatever was built to a DRAFT release; a human publishes it.
    needs: [api-image, sbom, android, ios]
    if: ${{ !cancelled() && needs.api-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release; no package access
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.api-image.outputs.image }}@${{ needs.api-image.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'API image (by digest): `%s`\n\nMigrations are NOT applied. Approve the "migrate-production" job of this run, then deploy the digest above.\n' "$IMAGE" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $(find artifacts -type f \( -name '*.aab' -o -name '*.ipa' -o -name '*.spdx.json' \) | tr '\n' ' ')

  migrate-production:
    # Waits for a required reviewer on the `production` environment (owner setup). Runs the image's own
    # /migrate against the production database; it does not start or replace the API.
    needs: [api-image, draft-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrate
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          IMAGE: ${{ needs.api-image.outputs.image }}@${{ needs.api-image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DATABASE_URL" || { echo "PRODUCTION_DATABASE_URL is not set on the production environment"; exit 1; }
          docker run --rm -e DATABASE_URL="$PRODUCTION_DATABASE_URL" --entrypoint /migrate "$IMAGE"
