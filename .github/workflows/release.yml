name: Release
# Runs only for tags like v1.2.3. Nothing here deploys: the API and admin images are pushed to GHCR by digest (and
# scanned there), the mobile bundles are built and attached to a DRAFT GitHub release, and the production migration
# waits for a reviewer to approve the `production` environment. Owner setup (environment, secrets, variables) is in
# docs/deployment/11-environments.md, section "GitHub". Rehearse this pipeline first with release-dryrun.yml.
#
# Which platforms ship is decided by the repository variable RELEASE_PLATFORMS (default "android,ios"). The `platforms`
# job normalises it once (spaces, case) and rejects an unknown name; every other job reads its output. A platform that is
# listed MUST have its signing secrets: its job fails when they are missing (it is never silently skipped). Leave a
# platform out of the variable to release without it.
#
# Store signing secrets live in the `release` ENVIRONMENT, not in repository secrets, so only the android and ios jobs can
# read them and only after a required reviewer approves (docs/deployment/11-environments.md item 9). Protect the v* tags
# too (Settings > Rules > Rulesets: only the owner may create or move them), or anyone with write access could start this
# pipeline by pushing a tag.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    # RELEASE_PLATFORMS="android, ios" used to match nothing in the job conditions below, and the platform was skipped without
    # a word. Normalise once, fail on a name nobody knows, and let every job read the result.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.p.outputs.list }}
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
    steps:
      - id: p
        env:
          RAW: ${{ vars.RELEASE_PLATFORMS }}
        run: |
          set -euo pipefail
          norm="$(printf '%s' "${RAW:-android,ios}" | tr -d ' \t\r\n' | tr 'A-Z' 'a-z')"
          android=false; ios=false
          IFS=',' read -r -a items <<< "$norm"
          for x in "${items[@]}"; do
            case "$x" in
              android) android=true ;;
              ios) ios=true ;;
              "") ;;
              *) echo "::error::RELEASE_PLATFORMS contains '$x'; the known platforms are android and ios"; exit 1 ;;
            esac
          done
          if [ "$android" = false ] && [ "$ios" = false ]; then echo "::error::RELEASE_PLATFORMS names no platform"; exit 1; fi
          list=""
          if [ "$android" = true ]; then list="android"; fi
          if [ "$ios" = true ]; then list="${list:+$list,}ios"; fi
          { echo "list=$list"; echo "android=$android"; echo "ios=$ios"; } >> "$GITHUB_OUTPUT"
          echo "Mobile platforms in this release: $list" >> "$GITHUB_STEP_SUMMARY"

  release-preflight:
    # Every release gate in one place (scripts/release-preflight.sh): the Foundation checks green on this commit, legal
    # text final, release inputs set, owner placeholders gone, contract current, go vet, govulncheck, the production and
    # release GitHub environments have reviewers. It fails the run before anything is built. Gate d (the production API
    # environment) needs secrets that live on the host, not in GitHub, so it cannot run here: it is skipped only while the
    # repository variable PREFLIGHT_HOST_CHECK equals this tag, which the owner sets after running `api check-config
    # -release` on the production host (docs/deployment/12-release-runbook.md, step 5). Any other skip needs
    # PREFLIGHT_SKIP_REASON. Gate o fails when it cannot read the environments (set RELEASE_GATE_TOKEN).
    needs: platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read   # gate n reads the check runs of the tagged commit
      actions: read  # gate o reads the `production` environment's protection rules
    env:
      # `python3 -I` ignores this variable, so the scripts also set sys.dont_write_bytecode; either way scripts/__pycache__
      # must not appear, or gate a sees an uncommitted change on every tag run.
      PYTHONDONTWRITEBYTECODE: '1'
      PREFLIGHT_SKIP: d,${{ vars.PREFLIGHT_SKIP }}
      PREFLIGHT_HOST_CHECK: ${{ vars.PREFLIGHT_HOST_CHECK }}
      PREFLIGHT_SKIP_REASON: ${{ vars.PREFLIGHT_SKIP_REASON }}
      GH_TOKEN: ${{ github.token }}
      # Fine-grained token with Administration: read (read only): the default token cannot see environment rules, so
      # without it gate o fails in CI unless it is skipped with a reason. Never a write token.
      GH_ADMIN_TOKEN: ${{ secrets.RELEASE_GATE_TOKEN }}
      RELEASE_PLATFORMS: ${{ needs.platforms.outputs.list }}
      # The signing secrets live in the `release` environment, which this job cannot read: the android and ios jobs refuse
      # to run without them.
      PREFLIGHT_ANDROID_SIGNING_IN_CI: deferred
      PREFLIGHT_IOS_SIGNING_IN_CI: deferred
      # Mirror of the production API setting: set SCAN_ALLOW_NONE=true here ONLY if production runs without an upload
      # scanner, and then also RELEASE_ACK_UNSCANNED=I_ACCEPT_UNSCANNED_PHOTOS (gate q; docs/deployment/12, step 0).
      SCAN_ALLOW_NONE: ${{ vars.SCAN_ALLOW_NONE }}
      RELEASE_ACK_UNSCANNED: ${{ vars.RELEASE_ACK_UNSCANNED }}
      # Mirrors of the production API settings for gate s: with PLANS_ENFORCED=true, or ADMOB_SSV_AD_UNIT_IDS set (the rewarded ad
      # units the server credits), the AdMob ids below must be real and not Google's test ids; otherwise they only warn.
      PLANS_ENFORCED: ${{ vars.PLANS_ENFORCED }}
      ADMOB_SSV_AD_UNIT_IDS: ${{ vars.ADMOB_SSV_AD_UNIT_IDS }}
      ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
      ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
      ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
      ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      SAFETY_EMAIL: ${{ vars.SAFETY_EMAIL }}
      PRIVACY_EMAIL: ${{ vars.PRIVACY_EMAIL }}
      APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the preflight checks that the tag is on main
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Install govulncheck (gate l fails in CI when it is missing)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: The preflight's own tests
        run: python3 scripts/test-release-preflight.py
      - name: The tree must still be clean (the tests write nothing)
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo "::error::the preflight tests changed the working tree"; exit 1; fi
      - run: scripts/release-preflight.sh

  checks:
    needs: release-preflight
    # A tag must point at a commit whose normal checks passed. The preflight (gate n) requires the Foundation
    # workflow to be green on this exact commit; this job re-runs the fast, decisive Go checks as a second look.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: hiyall
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: hiyall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hiyall -d hiyall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hiyall:ci-only-disposable@localhost:5432/hiyall_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://hiyall:ci-only-disposable@localhost:5432/hiyall_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go run ./cmd/migrate && go vet ./... && go test -race ./...
        working-directory: services/api

  api-image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR; no other job has this
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: name
        # GHCR names must be lower case. COMMIT is the 12-character commit stamped into the binary (startup log,
        # hiyall_build_info, the error tracker's release); VERSION is the tag.
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          build-args: |
            COMMIT=${{ steps.name.outputs.commit }}
            VERSION=${{ github.ref_name }}
      - name: Scan the pushed image by digest (trivy; fixable HIGH and CRITICAL fail the release)
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz" | sha256sum -c -
          mkdir /tmp/trivy && tar -xzf /tmp/trivy.tgz -C /tmp/trivy trivy
          /tmp/trivy/trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
      - run: echo "Pushed ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }} (commit ${{ steps.name.outputs.commit }}, version ${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"

  admin-image:
    # The moderation console image, built, stamped, scanned and pushed by digest exactly like the API image. It is never
    # deployed by this workflow; see docs/deployment/10-deploy-guide.md section 11.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/admin" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/api/Dockerfile.admin
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          build-args: |
            COMMIT=${{ steps.name.outputs.commit }}
            VERSION=${{ github.ref_name }}
      - name: Scan the pushed image by digest (trivy; fixable HIGH and CRITICAL fail the release)
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz" | sha256sum -c -
          mkdir /tmp/trivy && tar -xzf /tmp/trivy.tgz -C /tmp/trivy trivy
          /tmp/trivy/trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
      - run: echo "Pushed ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }} (commit ${{ steps.name.outputs.commit }}, version ${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    needs: [api-image, admin-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # anchore/sbom-action v0.24.2: the SHA is the commit the annotated tag points at, resolved with
      # `git ls-remote --tags https://github.com/anchore/sbom-action.git v0.24.2` (the ^{} line).
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ needs.api-image.outputs.image }}@${{ needs.api-image.outputs.digest }}
          format: spdx-json
          output-file: api-sbom.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ needs.admin-image.outputs.image }}@${{ needs.admin-image.outputs.digest }}
          format: spdx-json
          output-file: admin-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            api-sbom.spdx.json
            admin-sbom.spdx.json

  android:
    # Runs when RELEASE_PLATFORMS lists android (the default). Then the signing secrets, which live in the `release`
    # environment (required reviewers), are REQUIRED: the job fails without them.
    needs: [checks, platforms]
    if: ${{ needs.platforms.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Android is in RELEASE_PLATFORMS but the secret for $v is missing (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)"; exit 1; fi
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - # Rust mobile libraries: rust_builder (cargokit) compiles hiyall_e2ee for each Android ABI during
        # the Gradle build, so the targets must be installed first.
        run: |
          rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Write signing files (never committed, never logged)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > apps/mobile/android/key.properties
      - # build-release.sh fails on any missing define, so a build can never ship "not configured".
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SAFETY_EMAIL: ${{ vars.SAFETY_EMAIL }}
          PRIVACY_EMAIL: ${{ vars.PRIVACY_EMAIL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          # AdMob (docs/mobile/18-shop-and-ads.md): Gradle refuses a release build without the app id; the unit id goes in as a dart-define.
          ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
          ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
        run: scripts/build-release.sh android
      - name: Upload Dart debug symbols to Sentry
        # Obfuscated crashes are unreadable without these. Skipped, with a notice on the run, until the three
        # Sentry secrets exist (docs/mobile/16-release-and-reliability.md). @sentry/cli is pinned to an exact version.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN, SENTRY_ORG or SENTRY_PROJECT is not set: build/symbols was NOT uploaded to Sentry. Obfuscated crashes will not be readable. Keep the build/symbols artifact."
            exit 0
          fi
          npm install --global @sentry/cli@3.7.0
          sentry-cli debug-files upload apps/mobile/build/symbols
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: |
            apps/mobile/build/app/outputs/bundle/release/*.aab
            apps/mobile/build/symbols/**
          if-no-files-found: error
      - name: R8 mapping (deobfuscates Java and Kotlin stack traces; Play and Sentry want it for every build)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-r8-mapping
          path: apps/mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  ios:
    # Runs when RELEASE_PLATFORMS lists ios (the default). Signing is MANUAL: the certificate and the App Store
    # provisioning profile are installed into a temporary keychain, and scripts/build-release.sh archives with
    # `xcodebuild` (signing settings reach the Runner target only, through the git-ignored ios/Flutter/Signing.xcconfig)
    # and exports with apps/mobile/ios/ExportOptions.plist (team and profile name filled from the
    # profile). The first archive must be rehearsed on a Mac (docs/mobile/16-release-and-reliability.md). The secrets live
    # in the `release` environment (required reviewers).
    needs: [checks, platforms]
    if: ${{ needs.platforms.outputs.ios == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Signing secrets are present
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for v in CERT_B64 CERT_PASSWORD PROFILE_B64; do
            if [ -z "${!v}" ]; then echo "::error::iOS is in RELEASE_PLATFORMS but the secret for $v is missing (IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64)"; exit 1; fi
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - # Rust mobile libraries: cargokit builds the static library for the device during the Xcode build.
        run: |
          rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
          rustup target add aarch64-apple-ios
      - name: Install signing certificate and provisioning profile (temporary keychain)
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_OVERRIDE: ${{ vars.IOS_TEAM_ID }}
          PROFILE_NAME_OVERRIDE: ${{ vars.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/hiyall.mobileprovision"
          cp "$RUNNER_TEMP/hiyall.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/hiyall.mobileprovision
          # The manual-signing export needs the profile's NAME and the team id; read them from the profile itself
          # unless the repository variables IOS_PROFILE_NAME / IOS_TEAM_ID say otherwise. Neither is a secret.
          security cms -D -i "$RUNNER_TEMP/hiyall.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          name="${PROFILE_NAME_OVERRIDE:-$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")}"
          team="${TEAM_OVERRIDE:-$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")}"
          echo "IOS_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$team" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.plist"
      - env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SAFETY_EMAIL: ${{ vars.SAFETY_EMAIL }}
          PRIVACY_EMAIL: ${{ vars.PRIVACY_EMAIL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          # AdMob (docs/mobile/18-shop-and-ads.md): the app id goes to the git-ignored Admob.xcconfig, the unit id in as a dart-define.
          ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
          ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
        run: scripts/build-release.sh ios
      - name: Upload Dart debug symbols to Sentry
        # Obfuscated crashes are unreadable without these. Skipped, with a notice on the run, until the three
        # Sentry secrets exist (docs/mobile/16-release-and-reliability.md). @sentry/cli is pinned to an exact version.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN, SENTRY_ORG or SENTRY_PROJECT is not set: build/symbols was NOT uploaded to Sentry. Obfuscated crashes will not be readable. Keep the build/symbols artifact."
            exit 0
          fi
          npm install --global @sentry/cli@3.7.0
          sentry-cli debug-files upload apps/mobile/build/symbols
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa
          path: |
            apps/mobile/build/ios/ipa/*.ipa
            apps/mobile/build/symbols/**
          if-no-files-found: error

  draft-release:
    # Attaches whatever was built to a DRAFT release; a human publishes it. A platform that is not in
    # RELEASE_PLATFORMS is skipped on purpose (result "skipped"); one that is listed must have succeeded: failed, cancelled
    # (a reviewer rejected the release environment, or the run was cancelled) and skipped all block the draft.
    needs: [platforms, api-image, admin-image, sbom, android, ios]
    if: >-
      ${{ !cancelled() && needs.api-image.result == 'success' && needs.admin-image.result == 'success' && needs.sbom.result == 'success'
      && (needs.android.result == 'success' || (needs.platforms.outputs.android != 'true' && needs.android.result == 'skipped'))
      && (needs.ios.result == 'success' || (needs.platforms.outputs.ios != 'true' && needs.ios.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release; no package access
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ needs.api-image.outputs.image }}@${{ needs.api-image.outputs.digest }}
          ADMIN_IMAGE: ${{ needs.admin-image.outputs.image }}@${{ needs.admin-image.outputs.digest }}
          PLATFORMS: ${{ needs.platforms.outputs.list }}
          SCAN_ALLOW_NONE: ${{ vars.SCAN_ALLOW_NONE }}
          RELEASE_ACK_UNSCANNED: ${{ vars.RELEASE_ACK_UNSCANNED }}
        run: |
          set -euo pipefail
          {
            printf 'API image (by digest, commit %s): `%s`\n\n' "${GITHUB_SHA::12}" "$API_IMAGE"
            printf 'Admin console image (by digest): `%s`\n\n' "$ADMIN_IMAGE"
            printf 'Mobile platforms in this release: %s\n\n' "$PLATFORMS"
            if [ "$SCAN_ALLOW_NONE" = "true" ]; then
              printf '**UNSCANNED PHOTOS ACKNOWLEDGED (%s).** This release was approved with photo upload scanning OFF (SCAN_ALLOW_NONE=true). Uploaded photos are not checked against any hash list or provider before they are shown.\n\n' "$RELEASE_ACK_UNSCANNED"
            fi
            printf 'Migrations are NOT applied. Approve the "migrate-production" job of this run (it also refreshes the database role grants), then deploy the digest above.\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $(find artifacts -type f \( -name '*.aab' -o -name '*.ipa' -o -name '*.spdx.json' \) | tr '\n' ' ')

  migrate-production:
    # Waits for a required reviewer on the `production` environment (owner setup; the preflight's gate o checks it exists
    # with reviewers). Runs the image's own /migrate against the production database as the MIGRATION role
    # (MIGRATE_DATABASE_URL, hiyall_migrate, the table owner), with MIGRATE_RUN_GRANTS=true so the same step then refreshes the
    # grants of the API and admin roles (database/roles/grants.sql). The API's own DATABASE_URL is hiyall_api and the migration
    # URL is never an application secret. It does not start or replace the API.
    #
    # NETWORK: a GitHub-hosted runner has no fixed address. This job works only when the production database accepts
    # connections from it (an allowlist that includes GitHub's runner ranges, or a self-hosted runner / tunnel). If it cannot
    # connect, do not widen the database firewall for it: run the same command from your laptop or a one-off machine that
    # can reach the database (docs/deployment/10-deploy-guide.md section 5) and let this job fail.
    needs: [api-image, draft-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrate and refresh role grants
        env:
          PRODUCTION_MIGRATE_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATE_DATABASE_URL }}
          IMAGE: ${{ needs.api-image.outputs.image }}@${{ needs.api-image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_MIGRATE_DATABASE_URL" || { echo "PRODUCTION_MIGRATE_DATABASE_URL (the hiyall_migrate role) is not set on the production environment"; exit 1; }
          docker run --rm -e MIGRATE_DATABASE_URL="$PRODUCTION_MIGRATE_DATABASE_URL" -e MIGRATE_RUN_GRANTS=true --entrypoint /migrate "$IMAGE"
