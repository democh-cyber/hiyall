# `flutter gen-l10n` (also run by flutter pub get/run/test because of
# `generate: true` in pubspec.yaml) writes lib/l10n/app_localizations*.dart.
# The generated files are checked in so nothing depends on a generation step.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
use-escaping: true
